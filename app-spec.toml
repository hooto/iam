name        = "hooto-iam"
version     = "2.0.0"
description = "Identity and Access Management service built with Go and Svelte"
image       = "sysinner/innerstack-alpine:3.23"

[resources]
cpu_min     = "100m"
cpu_max     = "2000m"
memory_min  = "64Mi"
memory_max  = "2Gi"
volume_min  = "1Gi"
volume_max  = "100Gi"

[[packages]]
name    = "hooto-iam"
version = "2.0"

[[service_ports]]
port = 3000
name = "http"

# 数据库连接配置
[[configs]]
name = "db_addr"
type = "string"

[[configs]]
name = "db_name"
type = "string"

[[configs]]
name = "db_access_id"
type = "string"

[[configs]]
name = "db_access_secret"
type = "string"
auto_fill = "defval"

[[tasks]]
name = "run"
script = """
mkdir -p /opt/hooto/iam/etc /opt/hooto/iam/var
[ -f /opt/hooto/iam/etc/iam_config.toml ] || /home/action/.innerstack/inagent config-render --in ${ipk.hooto_iam.path}/misc/config.template.toml --out /opt/hooto/iam/etc/iam_config.toml
${ipk.hooto_iam.path}/bin/iam-server -prefix /opt/hooto/iam
"""
on_startup = true
